name: Verificar sistema
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ponto_test
          POSTGRES_PASSWORD: local-tests-only
          POSTGRES_DB: ponto_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend migrations tests
      - run: ruff format --check backend migrations tests
      - run: python -m pytest -q
        env:
          PONTO_TEST_POSTGRES: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://ponto_test:local-tests-only@localhost:5432/ponto_test' || '' }}
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-navegador
          path: frontend/test-results
          retention-days: 7
